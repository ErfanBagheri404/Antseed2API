name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run selfcheck
        run: python tests/selfcheck.py

      - name: Compile all modules
        run: python -m py_compile main.py server.py buyer.py version.py

      - name: Check node.mjs syntax
        run: node --check node.mjs
