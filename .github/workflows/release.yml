name: Release

# Every push to master bumps the patch version, tags it, builds a standalone
# binary for each OS with PyInstaller, and publishes a GitHub Release.
on:
  push:
    branches: [master]
    paths-ignore:
      - "VERSION"
      - "*.md"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to current master tip
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $next"

      - name: Commit version bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Antseed2Proxy-windows-amd64.exe
          - os: ubuntu-latest
            artifact: Antseed2Proxy-linux-amd64
          - os: macos-15-intel
            artifact: Antseed2Proxy-macos-amd64
          - os: macos-latest
            artifact: Antseed2Proxy-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build binary
        run: python -m PyInstaller --onefile --name "${{ matrix.artifact }}" --add-data "node.mjs:." --distpath dist --workpath build --specpath build main.py

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./dist/${{ matrix.artifact }} --help >/dev/null || true
          # The frozen exe must carry node.mjs for the bundled buyer node.
          python - <<'PY'
          import subprocess, sys, json, os
          out = subprocess.run([sys.executable, "-c",
              "import buyer, pathlib; print(buyer.NODE_MJS)"],
              capture_output=True, text=True, env={**os.environ})
          print(out.stdout.strip() or out.stderr.strip())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect binaries
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          chmod +x release/* || true
          ls -la release/

      - name: Build release notes
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${prev}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download the binary for your platform, then run:"
            echo
            echo '```'
            echo "./Antseed2Proxy-linux-amd64 --no-menu"
            echo '```'
            echo
            echo "The buyer node starts automatically with the server."
            echo "It needs Node.js 18+ on PATH and the @antseed packages in"
            echo "~/.antseed/plugins/node_modules (they ship with the AntSeed app)."
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${{ needs.version.outputs.version }}" \
            release/* \
            --title "v${{ needs.version.outputs.version }}" \
            --notes-file notes.md
